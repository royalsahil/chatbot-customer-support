<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Panel - Customer Support Chatbot Analytics">
    <title>Admin Panel - Chatbot Analytics</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Premium Admin Panel Styles */
        body {
            background: linear-gradient(180deg, #F0FDFA 0%, #ECFEFF 50%, #EFF6FF 100%) !important;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 40% 10%, rgba(124, 58, 237, 0.06) 0%, transparent 50%);
            animation: backgroundFloat 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes backgroundFloat {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            33% {
                transform: translate(30px, -30px) rotate(5deg);
            }

            66% {
                transform: translate(-20px, 20px) rotate(-5deg);
            }
        }

        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px;
            position: relative;
            z-index: 1;
        }

        .admin-header {
            background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 50%, #7C3AED 100%);
            color: white;
            padding: 40px;
            border-radius: 20px;
            margin-bottom: 40px;
            box-shadow: 0 10px 40px rgba(14, 165, 233, 0.25);
            position: relative;
            overflow: hidden;
        }

        .admin-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .admin-header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin: 0 0 10px 0;
            position: relative;
            z-index: 1;
        }

        .admin-header p {
            font-size: 1.1rem;
            opacity: 0.95;
            margin: 0 0 15px 0;
            position: relative;
            z-index: 1;
        }

        .admin-header a {
            position: relative;
            z-index: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid rgba(14, 165, 233, 0.15);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.04) 0%, rgba(6, 182, 212, 0.04) 100%);
            pointer-events: none;
        }

        .stat-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(14, 165, 233, 0.25);
            border-color: rgba(14, 165, 233, 0.35);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 50%, #7C3AED 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
            position: relative;
            z-index: 1;
        }

        .stat-label {
            color: #718096;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            position: relative;
            z-index: 1;
        }

        .conversations-table {
            background: white;
            border-radius: 20px;
            box-shadow: 0 6px 25px rgba(14, 165, 233, 0.15);
            overflow: hidden;
            border: 2px solid rgba(14, 165, 233, 0.15);
        }

        .table-header {
            background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 50%, #7C3AED 100%);
            color: white;
            padding: 30px;
            position: relative;
        }

        .table-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
        }

        .table-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            position: relative;
            z-index: 1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 18px 20px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: linear-gradient(to bottom, #F0FDFA 0%, #ffffff 100%);
            font-weight: 700;
            color: #1a202c;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: linear-gradient(to right, #F0FDFA 0%, #ffffff 100%);
        }

        .intent-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .confidence-bar {
            height: 8px;
            background: #e9ecff;
            border-radius: 10px;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.4);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            padding: 30px;
        }

        .pagination button {
            padding: 10px 20px;
            border: 2px solid transparent;
            background: white;
            color: #0EA5E9;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(14, 165, 233, 0.12);
        }

        .pagination button:hover:not(:disabled) {
            background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 50%, #7C3AED 100%);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.35);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 50%, #7C3AED 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #718096;
            font-weight: 500;
            font-size: 1.1rem;
        }

        #intentDistribution>div>div {
            padding: 15px;
            background: white;
            border-radius: 12px;
            border: 1px solid rgba(14, 165, 233, 0.15);
            transition: all 0.3s ease;
        }

        #intentDistribution>div>div:hover {
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.15);
            transform: translateX(5px);
        }
    </style>
</head>

<body style="background: #f5f7fa;">
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h1>📊 Chatbot Analytics Dashboard</h1>
            <p>Monitor conversations and track performance metrics</p>
            <a href="/" style="color: white; text-decoration: underline; margin-top: 10px; display: inline-block;">←
                Back to Chat</a>
        </div>

        <!-- Statistics Cards -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-label">Total Conversations</div>
                <div class="stat-value" id="totalConversations">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Positive Feedback</div>
                <div class="stat-value" id="positiveFeedback">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Negative Feedback</div>
                <div class="stat-value" id="negativeFeedback">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Satisfaction Rate</div>
                <div class="stat-value" id="satisfactionRate">-</div>
            </div>
        </div>

        <!-- Intent Distribution -->
        <div class="conversations-table" style="margin-bottom: 30px;">
            <div class="table-header">
                <h2>Intent Distribution</h2>
            </div>
            <div style="padding: 20px;">
                <div id="intentDistribution"></div>
            </div>
        </div>

        <!-- Recent Conversations -->
        <div class="conversations-table">
            <div class="table-header">
                <h2>Recent Conversations</h2>
            </div>
            <div id="conversationsTable">
                <div class="loading">Loading conversations...</div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        const perPage = 20;

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch('/api/admin/stats');
                const data = await response.json();

                if (data.success) {
                    const stats = data.stats;

                    // Update stat cards
                    document.getElementById('totalConversations').textContent = stats.total_conversations;
                    document.getElementById('positiveFeedback').textContent = stats.feedback.positive;
                    document.getElementById('negativeFeedback').textContent = stats.feedback.negative;

                    // Calculate satisfaction rate
                    const total = stats.feedback.positive + stats.feedback.negative;
                    const rate = total > 0 ? ((stats.feedback.positive / total) * 100).toFixed(1) : 0;
                    document.getElementById('satisfactionRate').textContent = rate + '%';

                    // Display intent distribution
                    displayIntentDistribution(stats.intent_distribution);
                }
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        // Display intent distribution
        function displayIntentDistribution(distribution) {
            const container = document.getElementById('intentDistribution');
            const total = Object.values(distribution).reduce((a, b) => a + b, 0);

            let html = '<div style="display: grid; gap: 15px;">';

            for (const [intent, count] of Object.entries(distribution)) {
                const percentage = total > 0 ? ((count / total) * 100).toFixed(1) : 0;
                const color = getIntentColor(intent);

                html += `
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
                            <span style="font-weight: 500;">${intent}</span>
                            <span style="color: #666;">${count} (${percentage}%)</span>
                        </div>
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${percentage}%; background: ${color};"></div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        // Get color for intent
        function getIntentColor(intent) {
            const colors = {
                'greeting': '#10B981',
                'order_status': '#0EA5E9',
                'order_cancellation': '#F59E0B',
                'refund_policy': '#EF4444',
                'contact_support': '#8B5CF6',
                'product_info': '#06B6D4',
                'thanks': '#14B8A6',
                'goodbye': '#64748B',
                'unknown': '#94A3B8'
            };
            return colors[intent] || '#0EA5E9';
        }

        // Load conversations
        async function loadConversations(page = 1) {
            try {
                const response = await fetch(`/api/admin/conversations?page=${page}&per_page=${perPage}`);
                const data = await response.json();

                if (data.success) {
                    displayConversations(data.conversations);
                    displayPagination(data.current_page, data.pages);
                }
            } catch (error) {
                console.error('Error loading conversations:', error);
                document.getElementById('conversationsTable').innerHTML =
                    '<div class="loading">Error loading conversations</div>';
            }
        }

        // Display conversations
        function displayConversations(conversations) {
            const container = document.getElementById('conversationsTable');

            if (conversations.length === 0) {
                container.innerHTML = '<div class="loading">No conversations yet</div>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>User Message</th>
                            <th>Bot Response</th>
                            <th>Intent</th>
                            <th>Confidence</th>
                            <th>Feedback</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            conversations.forEach(conv => {
                const time = new Date(conv.timestamp).toLocaleString();
                const confidence = conv.confidence ? (conv.confidence * 100).toFixed(0) : 0;
                const color = getIntentColor(conv.intent);

                html += `
                    <tr>
                        <td style="white-space: nowrap; font-size: 0.85rem; color: #666;">${time}</td>
                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${conv.user_message}</td>
                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis;">${conv.bot_response.substring(0, 100)}...</td>
                        <td>
                            <span class="intent-badge" style="background: ${color}20; color: ${color};">
                                ${conv.intent || 'unknown'}
                            </span>
                        </td>
                        <td>
                            <div style="width: 60px;">
                                <div style="font-size: 0.85rem; margin-bottom: 3px;">${confidence}%</div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style="width: ${confidence}%;"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            ${conv.feedback ? (conv.feedback === 'positive' ? '👍' : '👎') : '-'}
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Display pagination
        function displayPagination(current, total) {
            const container = document.getElementById('pagination');

            if (total <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';

            // Previous button
            html += `<button ${current <= 1 ? 'disabled' : ''} onclick="loadConversations(${current - 1})">Previous</button>`;

            // Page numbers
            for (let i = 1; i <= Math.min(total, 10); i++) {
                html += `<button class="${i === current ? 'active' : ''}" onclick="loadConversations(${i})">${i}</button>`;
            }

            if (total > 10) {
                html += '<button disabled>...</button>';
            }

            // Next button
            html += `<button ${current >= total ? 'disabled' : ''} onclick="loadConversations(${current + 1})">Next</button>`;

            container.innerHTML = html;
        }

        // Load data on page load
        loadStats();
        loadConversations(1);

        // Refresh data every 30 seconds
        setInterval(() => {
            loadStats();
            loadConversations(currentPage);
        }, 30000);
    </script>
</body>

</html>
